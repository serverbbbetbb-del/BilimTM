<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AgoshMC | Minecraft Domen</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 0%, #087f88 0, transparent 35%),
        linear-gradient(135deg, #02131f, #063c49, #011018);
}

header {
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,15,25,.8);
    border-bottom: 1px solid #1b7e86;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 900;
    color: #55f4e4;
}

.block {
    width: 34px;
    height: 34px;
    background: #159da6;
    border: 3px solid #55f4e4;
    box-shadow: 4px 4px #03444e;
}

.login {
    border: 0;
    padding: 11px 17px;
    border-radius: 10px;
    background: white;
    color: #222;
    font-weight: bold;
    cursor: pointer;
}

.container {
    width: min(950px, 92%);
    margin: auto;
}

.hero {
    text-align: center;
    padding: 60px 10px 30px;
}

.flag {
    font-size: 38px;
}

h1 {
    margin-top: 10px;
    font-size: clamp(35px, 7vw, 65px);
    color: #55f4e4;
    text-shadow: 4px 4px #03444e;
}

.hero p {
    margin-top: 12px;
    color: #b8dce0;
}

.card {
    margin: 25px auto;
    padding: 28px;
    max-width: 700px;
    background: rgba(2,28,40,.94);
    border: 1px solid #167984;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

h2 {
    color: #55f4e4;
    margin-bottom: 20px;
}

label {
    display: block;
    margin: 16px 0 8px;
    font-weight: bold;
    color: #d1eeee;
}

input,
select {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #1b7780;
    background: #031923;
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus,
select:focus {
    border-color: #55f4e4;
}

.preview {
    margin-top: 10px;
    padding: 12px;
    border-radius: 9px;
    background: #01131b;
    color: #55f4e4;
    font-family: monospace;
}

.create {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(135deg,#55f4e4,#18abb5);
    color: #012027;
    font-weight: 900;
    font-size: 16px;
    cursor: pointer;
}

.create:hover {
    transform: translateY(-2px);
}

.domain-list {
    margin: 50px auto;
}

.domain {
    padding: 17px;
    margin: 10px 0;
    background: rgba(2,28,40,.9);
    border: 1px solid #145b63;
    border-radius: 12px;
}

.domain-name {
    color: #55f4e4;
    font-family: monospace;
    font-size: 17px;
}

.domain-ip {
    margin-top: 6px;
    color: #91b7bc;
    font-size: 13px;
}

.status {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 9px;
    border-radius: 6px;
    background: #084d43;
    color: #66ffe8;
    font-size: 12px;
}

footer {
    text-align: center;
    padding: 35px 10px;
    color: #8db7bb;
}

@media(max-width:600px) {

    header {
        padding: 14px 4%;
    }

    .logo {
        font-size: 17px;
    }

    .login {
        padding: 9px 11px;
        font-size: 12px;
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <div class="block"></div>
        AGOSHMC
    </div>

    <button class="login" onclick="googleLogin()">
        🔐 Google bilen gir
    </button>

</header>


<main class="container">

<section class="hero">

    <div class="flag">🇹🇲</div>

    <h1>Minecraft Domen</h1>

    <p>
        Minecraft serweriň üçin mugt domen saýla
        we serwer IP adresiňi giriz.
    </p>

</section>


<section class="card">

    <h2>🌐 Domen döret</h2>

    <label>Domen hyzmaty</label>

    <select id="provider" onchange="updatePreview()">

        <option value="min3">
            Min3.online
        </option>

        <option value="tm">
            .tm
        </option>

    </select>


    <label>Domen ady</label>

    <input
        id="domain"
        type="text"
        placeholder="agoshmc"
        oninput="updatePreview()"
    >


    <div class="preview" id="preview">
        agoshmc.min3.online
    </div>


    <label>Minecraft serwer IP adresi</label>

    <input
        id="ip"
        type="text"
        placeholder="123.123.123.123:25565"
    >


    <button class="create" onclick="createDomain()">
        ⛏️ Domen döret
    </button>

</section>


<section class="domain-list">

    <h2>📋 Domenlerim</h2>

    <div id="list"></div>

</section>

</main>


<footer>
    🇹🇲 AgoshMC Minecraft Domen Ulgamy
    <br><br>
    © 2026 AGOSHMC
</footer>


<script>

function updatePreview() {

    let name =
        document.getElementById("domain")
        .value
        .toLowerCase()
        .replace(/[^a-z0-9-]/g, "");

    if (!name) {
        name = "agoshmc";
    }

    let provider =
        document.getElementById("provider").value;

    let domain;

    if (provider === "min3") {
        domain = name + ".min3.online";
    } else {
        domain = name + ".tm";
    }

    document.getElementById("preview").innerText =
        domain;
}


function createDomain() {

    let name =
        document.getElementById("domain")
        .value
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9-]/g, "");

    let ip =
        document.getElementById("ip")
        .value
        .trim();

    let provider =
        document.getElementById("provider").value;

    if (!name) {
        alert("Domen adyny giriz!");
        return;
    }

    if (!ip) {
        alert("Minecraft serwer IP adresiňi giriz!");
        return;
    }

    let domain;

    if (provider === "min3") {
        domain = name + ".min3.online";
    } else {
        domain = name + ".tm";
    }

    let list =
        document.getElementById("list");

    let item =
        document.createElement("div");

    item.className = "domain";

    item.innerHTML = `
        <div class="domain-name">
            ${domain}
        </div>

        <div class="domain-ip">
            Minecraft IP: ${ip}
        </div>

        <div class="status">
            Garaşylýar
        </div>
    `;

    list.prepend(item);

    alert(
        "Domen goşuldy: " + domain
    );

    document.getElementById("domain").value = "";
    document.getElementById("ip").value = "";

    updatePreview();
}


function googleLogin() {

    alert(
        "Google bilen giriş üçin OAuth sazlamasy gerek."
    );

}

</script>

</body>
</html>
